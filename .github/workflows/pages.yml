name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Wait for the Pages artifact to be indexed
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id')"
            if [[ -n "$artifact_id" ]]; then
              echo "id=$artifact_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded Pages artifact did not become visible." >&2
          exit 1
      - name: Deploy the verified artifact to GitHub Pages
        uses: actions/github-script@v8
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Expected a single verified Pages artifact ID.');
            }

            // Use the REST artifact ID because the runner artifact service can omit the upload.
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            }).catch(error => {
              throw new Error('GitHub Pages rejected the deployment request: ' + error.message);
            });

            const terminalFailures = new Set([
              'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost',
            ]);
            for (let attempt = 0; attempt < 48; attempt++) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo,
                pages_deployment_id: deployment.id,
              }).catch(error => {
                if (error.status !== 404) throw error;
                return null;
              });
              const status = result?.data.status;
              if (status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (terminalFailures.has(status)) throw new Error('GitHub Pages deployment ended with ' + status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('GitHub Pages did not confirm deployment within four minutes.');
